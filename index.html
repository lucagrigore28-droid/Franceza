<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahier de français</title>
<meta name="description" content="Lecții, exerciții și test simulat pentru acordul participiului trecut (COD și COI) și timpurile verbale franceze.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: bară laterală de "caiet" + coloană de lectură; exemplele franceze stau pe foi Seyès (liniatura școlară franceză), cu un cod de culori fix pentru rolurile gramaticale. */
:root {
  --bg: #F2F5FB;
  --surface: #FFFFFF;
  --surface-2: #E8EDF7;
  --ink: #101831;
  --ink-2: #47526F;
  --ink-3: #76819F;
  --line: #D6DDEC;
  --line-2: #BFC9E0;
  --navy: #1B2A5E;
  --on-navy: #FFFFFF;
  --grid: rgba(60, 96, 190, .15);
  --grid-strong: rgba(60, 96, 190, .27);
  --margin: #E0525B;

  --s: #17855A;      /* subiect */
  --v: #C8264F;      /* verb */
  --cod: #2563EB;    /* complement direct */
  --coi: #D4600A;    /* complement indirect */
  --aux: #7240D6;    /* auxiliar / participiu */
  --ok: #17855A;
  --bad: #C8264F;
  --warn: #A8710F;
  --s-bg: color-mix(in srgb, var(--s) 13%, transparent);
  --v-bg: color-mix(in srgb, var(--v) 12%, transparent);
  --cod-bg: color-mix(in srgb, var(--cod) 12%, transparent);
  --coi-bg: color-mix(in srgb, var(--coi) 14%, transparent);
  --aux-bg: color-mix(in srgb, var(--aux) 12%, transparent);
  --ok-bg: color-mix(in srgb, var(--ok) 12%, transparent);
  --bad-bg: color-mix(in srgb, var(--bad) 11%, transparent);
  --warn-bg: color-mix(in srgb, var(--warn) 14%, transparent);
  --shadow: 0 1px 2px rgba(16, 24, 49, .06), 0 6px 20px rgba(16, 24, 49, .05);

  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-fr: 'Newsreader', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1124; --surface: #131B37; --surface-2: #1A2447; --ink: #E8ECFA; --ink-2: #AAB5D5; --ink-3: #7B88AF;
    --line: #26325E; --line-2: #36447B; --navy: #A3B6FF; --on-navy: #0B1124;
    --grid: rgba(130, 165, 255, .10); --grid-strong: rgba(130, 165, 255, .19); --margin: #F0707A;
    --s: #4DCB8C; --v: #FF7090; --cod: #6EA3FF; --coi: #FFA24F; --aux: #B89DFF; --ok: #4DCB8C; --bad: #FF7090; --warn: #E8B04A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1124; --surface: #131B37; --surface-2: #1A2447; --ink: #E8ECFA; --ink-2: #AAB5D5; --ink-3: #7B88AF;
  --line: #26325E; --line-2: #36447B; --navy: #A3B6FF; --on-navy: #0B1124;
  --grid: rgba(130, 165, 255, .10); --grid-strong: rgba(130, 165, 255, .19); --margin: #F0707A;
  --s: #4DCB8C; --v: #FF7090; --cod: #6EA3FF; --coi: #FFA24F; --aux: #B89DFF; --ok: #4DCB8C; --bad: #FF7090; --warn: #E8B04A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1rem/1.62 var(--f-body);
  margin: 0; overflow-x: hidden;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cod); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--cod) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); letter-spacing: -.015em; line-height: 1.12; margin: 0; text-wrap: balance; color: var(--ink); }
p { margin: 0 0 .9em; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0 0 .9em; padding-left: 1.25em; }
li { margin-bottom: .3em; }
b, strong { font-weight: 700; }
small, .small { font-size: .875rem; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== shell ===== */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.side {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; display: none; flex-direction: column; gap: 18px;
}
.side.open { display: flex; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 38px; height: 44px; flex: none; border-radius: 4px 8px 8px 4px; background: var(--surface);
  background-image: linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--margin) 2px, transparent 2px);
  background-size: 100% 8px, 100% 100%; background-position: 0 3px, 9px 0;
  border: 1px solid var(--line-2); box-shadow: 3px 3px 0 var(--line);
}
.brand-name { font: 800 1.2rem/1 var(--f-display); letter-spacing: -.02em; }
.brand-sub { font-size: .76rem; color: var(--ink-2); margin-top: 3px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-h { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 10px 12px 4px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--ink-2);
  font-weight: 600; font-size: .95rem; min-height: 40px;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--navy); color: var(--on-navy); }
.nav .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: .72rem; font-weight: 700; flex: none; opacity: .8; font-variant-numeric: tabular-nums; }
.nav .n.done { background: var(--ok); border-color: var(--ok); color: #fff; opacity: 1; }
.nav a[aria-current="page"] .n.done { background: transparent; border-color: currentColor; color: inherit; }
.nav .ico { width: 22px; text-align: center; opacity: .85; flex: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: .85rem; color: var(--ink-2); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--navy); border-radius: 99px; transition: width .4s ease; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top .brand-name { font-size: 1.05rem; }
.top .sp { flex: 1; }
.iconbtn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn:hover { background: var(--surface-2); }
.main { min-width: 0; }
.wrap { width: 100%; max-width: 920px; margin: 0 auto; padding: 28px 16px 90px; }
@media (min-width: 640px) { .wrap { padding-inline: 28px; } }
@media (min-width: 1024px) {
  .app { grid-template-columns: 290px minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; z-index: 1; border-right: 1px solid var(--line); padding-top: 22px; }
  .top { display: none; }
  .wrap { padding-top: 44px; padding-inline: 44px; }
  .only-m { display: none !important; }
}
@media (max-width: 1023px) { .only-d { display: none !important; } }

/* ===== tipografie de pagină ===== */
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 10px; display: block; }
.page-title { font-size: clamp(2rem, 5.2vw, 3.1rem); font-weight: 800; margin-bottom: 14px; }
.lead { font-size: 1.12rem; color: var(--ink-2); max-width: 62ch; margin-bottom: 26px; }
section.sec { margin-top: 44px; scroll-margin-top: 76px; }
section.sec > h2 { font-size: clamp(1.4rem, 3.2vw, 1.85rem); font-weight: 750; margin-bottom: 12px; }
.sub { font-size: 1.15rem; font-weight: 700; margin: 24px 0 8px; }
.prose { max-width: 68ch; }
.prose p { margin-bottom: 1em; }
.fr { font-family: var(--f-fr); font-size: 1.14em; font-weight: 500; font-feature-settings: "liga", "kern"; }
.ro { color: var(--ink-2); }
.badge {
  display: inline-flex; align-items: center; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.badge.ess { background: var(--ok-bg); color: var(--ok); }
.badge.bon { background: var(--warn-bg); color: var(--warn); }
.badge.g1 { background: var(--cod-bg); color: var(--cod); }
.badge.g2 { background: var(--s-bg); color: var(--s); }
.badge.g3 { background: var(--coi-bg); color: var(--coi); }
.badge.av { background: var(--aux-bg); color: var(--aux); }

/* ===== butoane, chip-uri ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px;
  border: 1.5px solid var(--navy); background: var(--navy); color: var(--on-navy); font-weight: 700; cursor: pointer; text-decoration: none; line-height: 1.2;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.sec:hover { background: var(--surface-2); filter: none; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 36px; border-radius: 99px; border: 1.5px solid var(--line-2);
  background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: .92rem; cursor: pointer;
}
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"], .chip.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.chip.static { cursor: default; background: var(--surface-2); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: 12px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 650; color: var(--ink-2); cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ===== carduri, callouts ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card > h3, .card > h4 { margin-bottom: 8px; }
.grid2, .grid3 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: repeat(3, 1fr); } }
.grid-auto { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.callout { border-radius: 14px; padding: 14px 16px 15px; background: var(--surface-2); }
.callout > .cl { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; color: var(--ink-2); }
.callout.rule { background: var(--aux-bg); } .callout.rule > .cl { color: var(--aux); }
.callout.tip { background: var(--ok-bg); } .callout.tip > .cl { color: var(--ok); }
.callout.warn { background: var(--warn-bg); } .callout.warn > .cl { color: var(--warn); }
.callout.bad { background: var(--bad-bg); } .callout.bad > .cl { color: var(--bad); }
.callout.info { background: var(--cod-bg); } .callout.info > .cl { color: var(--cod); }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
details.acc { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
details.acc + details.acc { margin-top: 10px; }
details.acc > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after { content: '+'; margin-left: auto; font-size: 1.3rem; color: var(--ink-3); font-weight: 500; }
details.acc[open] > summary::after { content: '–'; }
details.acc > .acc-b { padding: 0 18px 18px; }

/* ===== foaia Seyès ===== */
.board {
  position: relative; border: 1px solid var(--line-2); border-radius: 12px; background-color: var(--surface); padding: 12px 18px 12px 62px; overflow: hidden;
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 32px, 100% 8px, 32px 100%;
  background-position: 0 -1px, 0 -1px, 14px 0;
}
.board::before { content: ''; position: absolute; left: 44px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .6; }
.board .fr { font-size: clamp(1.35rem, 3.4vw, 1.75rem); line-height: 32px; margin: 0; }
.board .line { min-height: 64px; display: flex; align-items: flex-end; flex-wrap: wrap; row-gap: 0; padding-bottom: 3px; }
.board p.tr { margin: 6px 0 0; font-size: .9rem; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); display: inline-block; padding: 1px 6px; border-radius: 6px; }

/* ===== roluri gramaticale ===== */
.r { font-weight: 650; }
.r-S { color: var(--s); text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.r-V { color: var(--v); }
.r-COD { color: var(--cod); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.r-COI { color: var(--coi); text-decoration: underline dashed; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.r-AUX { color: var(--aux); }
.r-CC { color: var(--ink-3); font-weight: 500; }
.rb { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 8px; font-weight: 700; font-size: .84rem; white-space: nowrap; }
.rb-S { background: var(--s-bg); color: var(--s); } .rb-V { background: var(--v-bg); color: var(--v); }
.rb-COD { background: var(--cod-bg); color: var(--cod); } .rb-COI { background: var(--coi-bg); color: var(--coi); }
.rb-AUX { background: var(--aux-bg); color: var(--aux); }
.tk { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; margin-right: .38em; }
.tk > i { font: 700 .6rem/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; margin-top: 4px; font-style: normal; opacity: 1; text-decoration: none; }
.tk.hid > i { visibility: hidden; }
.tk.pick { cursor: pointer; border-radius: 8px; padding: 0 4px; margin-right: .2em; border: 0; background: transparent; font-family: inherit; font-size: inherit; line-height: inherit; color: inherit; }
.tk.pick:hover { background: var(--surface-2); }
.tk.pick.sel { background: color-mix(in srgb, var(--navy) 18%, transparent); outline: 2px solid var(--navy); }
.tk.pick.good { background: var(--ok-bg); outline: 2px solid var(--ok); }
.tk.pick.miss { background: var(--bad-bg); outline: 2px dashed var(--bad); }
.tk.pick.wrong { background: var(--bad-bg); outline: 2px solid var(--bad); }
.pp-live { transition: color .2s; }

/* ===== exemple ===== */
.ex-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.ex { padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.ex > div { min-width: 0; flex: 1; }
.ex .fr { margin: 0; font-size: 1.2rem; line-height: 1.35; }
.ex .ro { margin: 2px 0 0; font-size: .9rem; }
.say { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; padding: 0; }
.say:hover { background: var(--surface-2); color: var(--ink); }
.say svg { width: 16px; height: 16px; }
.nosay .say { display: none; }

/* ===== tabele de conjugare ===== */
.tscroll { overflow-x: auto; max-width: 100%; border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px; vertical-align: top; }
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); font-weight: 700; white-space: nowrap; }
.tbl td { border-top: 1px solid var(--line); }
.tbl td.k { font-weight: 700; white-space: nowrap; }
.conj { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.conj > h4 { padding: 10px 14px; background: var(--surface-2); font: 700 .95rem var(--f-display); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.conj table td { padding: 6px 14px; border-top: 1px solid var(--line); font-family: var(--f-fr); font-size: 1.12rem; white-space: nowrap; }
.conj table tr:first-child td { border-top: 0; }
.conj .pn { color: var(--ink-3); font-size: .98rem; }
.conj .st { color: var(--ink); }
.conj .en { color: var(--v); font-weight: 700; }
.conj .ax { color: var(--aux); font-weight: 600; }
.conj .pp { color: var(--aux); font-weight: 700; }
.conj .rf { color: var(--ink-2); }
.conj .sayrow { width: 36px; text-align: right; padding-left: 0; padding-right: 8px; }
.conj .say { width: 28px; height: 28px; border-color: transparent; background: transparent; }
.conj-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); margin: 8px 0; }
.legend b { font-family: var(--f-fr); font-size: 1.05rem; }

/* ===== formule ===== */
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
.fx { padding: 8px 14px; border-radius: 12px; font-weight: 700; background: var(--surface-2); }
.fx.a { background: var(--aux-bg); color: var(--aux); }
.fx.v { background: var(--v-bg); color: var(--v); }
.fx.c { background: var(--cod-bg); color: var(--cod); }
.fx.o { background: var(--coi-bg); color: var(--coi); }
.fx.s { background: var(--s-bg); color: var(--s); }
.fxop { color: var(--ink-3); font-weight: 700; font-size: 1.2rem; }

/* ===== formulare, exerciții ===== */
input[type="text"], input[type="search"], select {
  min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); min-width: 0;
}
input[type="text"]:focus, input[type="search"]:focus { outline: 3px solid color-mix(in srgb, var(--cod) 45%, transparent); border-color: var(--cod); }
input.fill { font-family: var(--f-fr); font-size: 1.15rem; min-width: 8ch; width: 11ch; padding: 4px 10px; min-height: 40px; text-align: center; margin: 0 4px; }
input.fill.ok { border-color: var(--ok); background: var(--ok-bg); }
input.fill.no { border-color: var(--bad); background: var(--bad-bg); }
.accents { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* ---------- generatoare ---------- */
const TEACH = ['parler', 'finir', 'vendre', 'aller', 'faire', 'prendre', 'venir', 'pouvoir', 'vouloir', 'savoir', 'voir', 'dire', 'mettre', 'devoir', 'manger', 'commencer', 'acheter', 'appeler', 'ouvrir', 'écrire', 'lire', 'boire', 'partir', 'recevoir', 'croire', 'connaître', 'choisir', 'attendre', 'répondre', 'comprendre', 'apprendre', 'envoyer', 'préférer', 'regarder', 'travailler', 'être', 'avoir'];
const HINT_T = {
  present: 'Radical + terminațiile grupei.', pc: 'Auxiliar la prezent + participiu trecut.', imp: 'Radicalul lui <i>nous</i> (prezent, fără -ons) + terminațiile imperfectului.',
  fs: 'Infinitiv (sau radical neregulat de viitor) + ai, as, a, ons, ez, ont.', cond: 'Radicalul viitorului + terminațiile imperfectului.', pqp: 'Auxiliar la imparfait + participiu trecut.',
  subj: '<i>que</i> + radicalul lui <i>ils</i> + e, es, e, ions, iez, ent.', fp: '<i>aller</i> la prezent + infinitiv.', pr: '<i>venir</i> la prezent + de + infinitiv.',
  fa: 'Auxiliar la futur simple + participiu trecut.', condp: 'Auxiliar la conditionnel présent + participiu trecut.', impe: 'Forma de prezent, fără pronume.'
};
const COMPOUND = ['pc', 'pqp', 'fa', 'condp'];
function verbsFor(tid) {
  return TEACH.filter(v => {
    const vo = FR.getVerb(v);
    if (!vo.v) return false;
    if (COMPOUND.includes(tid) && vo.v.aux !== 'avoir') return false;
    if (tid === 'impe' && !vo.v.imper) return false;
    if (tid === 'subj' && !vo.v.subj) return false;
    if (tid === 'pr' && /^(être|avoir|pouvoir|vouloir|savoir|devoir)$/.test(v)) return false;
    return true;
  });
}
const LEVEL_TENSES = { 1: ['present', 'pc', 'imp', 'fs'], 2: ['present', 'pc', 'imp', 'fs', 'fp', 'pr', 'cond', 'pqp'], 3: ['pc', 'imp', 'fs', 'cond', 'pqp', 'subj', 'condp', 'fa'] };
function conjSingle(tid) {
  tid = tid || pick(LEVEL_TENSES[S.exLevel || 2]);
  const inf = pick(verbsFor(tid));
  const vo = FR.getVerb(inf);
  let rows = FR.rows(vo, tid);
  const r = pick(rows.filter(x => x.i !== 2 || Math.random() < .5));
  const ans = FR.flat(r.segs);
  const pre = r.pre;
  const ro = vo.v.ro ? ` (${vo.v.ro})` : '';
  return mkq({
    kind: 'fill', cat: 'conj', ins: `Conjugă «${inf}»${ro} la ${TNAME[tid]}:`, tpl: `${pre}___`, ans: [[ans]], rawPre: pre,
    why: `<b>${r.full}</b>. ${HINT_T[tid] || ''}`

}
function conjTable(tid) {

    rows: rows.map(r => ({ label: tid === 'impe' ? r.lab : r.pre.trim() ? r.pre : '', ans: FR.flat(r.segs) })),

const PP_REG = [['parler', 'parlé', 'a vorbi'], ['manger', 'mangé', 'a mânca'], ['regarder', 'regardé', 'a privi'], ['choisir', 'choisi', 'a alege'], ['finir', 'fini', 'a termina'],
  ['réussir', 'réussi', 'a reuși'], ['vendre', 'vendu', 'a vinde'], ['attendre', 'attendu', 'a aștepta'], ['répondre', 'répondu', 'a răspunde'], ['perdre', 'perdu', 'a pierde'], ['entendre', 'entendu', 'a auzi'], ['arriver', 'arrivé', 'a ajunge']];
function genPP() {
  const useIrr = Math.random() < .75;
  const e = useIrr ? pick(C.PP) : pick(PP_REG);
  const inf = useIrr ? e[1] : e[0], pp = useIrr ? e[0] : e[1], ro = useIrr ? e[2] : e[2];

  return mkq({ kind: 'fill', cat: 'pp', ins: `Care este participiul trecut al lui «${inf}» (${ro})?`, tpl: '___', ans: [[pp]], why: `<b>${inf} → ${pp}</b>. ${note}` });
}
const AUX_ETRE = ['devenir', 'revenir', 'rester', 'venir', 'aller', 'naître', 'entrer', 'tomber', 'arriver', 'mourir', 'partir'];
const AUX_AVOIR = ['manger', 'finir', 'parler', 'voir', 'prendre', 'faire', 'dormir', 'courir', 'marcher', 'vivre', 'écrire', 'lire', 'avoir', 'être', 'sourire', 'choisir', 'boire', 'ouvrir', 'comprendre', 'dire'];
const AUX_PRON = ['se laver', 'se lever', 's’habiller', 'se souvenir', 'se promener', 'se coucher'];
function genAux() {
  if (Math.random() < .3) {
    const b = pick(C.BOTH);
    const src = Math.random() < .5 ? b[1] : b[2];
    const m = src.match(/<b>(est|a|sont|ont)<\/b>/);
    if (m) {
      const pair = (m[1] === 'est' || m[1] === 'a') ? ['a', 'est'] : ['ont', 'sont'];
      const opts = shuffle(pair);
      return mkq({
        kind: 'mcq', cat: 'aux', ins: `Alege auxiliarul. «${b[0]}» are două auxiliare, în funcție de COD.`, text: src.replace(m[0], '<b class="ans">___</b>'),
        opts, ans: opts.indexOf(m[1]), frOpts: true,
        why: `<i>${b[0]}</i> se conjugă cu <b>${m[1]}</b> aici: ${m[1] === 'est' || m[1] === 'sont' ? 'nu există COD, deci <b>être</b>' : 'există un COD, deci <b>avoir</b>'}.`
      });
    }
  }
  const kind = pick(['e', 'a', 'a', 'p']);
  const inf = kind === 'e' ? pick(AUX_ETRE) : kind === 'a' ? pick(AUX_AVOIR) : pick(AUX_PRON);
  const etre = kind !== 'a';
  const why = kind === 'e' ? `<i>${inf}</i> este în lista <b>DR &amp; MRS VANDERTRAMP</b> → <b>être</b>.` : kind === 'p' ? 'Toate verbele pronominale se conjugă cu <b>être</b>.' : `<i>${inf}</i> nu este în lista verbelor cu être → <b>avoir</b>.`;
  const opts = shuffle(['avoir', 'être']);
  return mkq({ kind: 'mcq', cat: 'aux', ins: `Cu ce auxiliar se conjugă «${inf}» la passé composé?`, text: `<span class="fr">${esc(inf)}</span>`, opts, ans: opts.indexOf(etre ? 'être' : 'avoir'), why });
}
function genTransform(forceLv) {
  const lv = forceLv || S.exLevel || pick([1, 2, 2, 3]);
  const pairs = C.TR_PAIRS.filter(p => p[0] <= lv);
  for (let tries = 0; tries < 12; tries++) {
    const [, from, to] = pick(pairs);
    const d = pick(C.TR);
    if ((to === 'pr' || from === 'pr') && /^(être|avoir|pouvoir|vouloir|savoir|devoir)$/.test(d.verb)) continue;
    const src = FR.sentence(d, from), ans = FR.sentence(d, to);
    if (src === ans) continue;
    return mkq({
      kind: 'fill', cat: 'transform', wide: true, ins: `Treci la ${TNAME[to]}.`,
      pre: `<span class="badge">${TNAME[from]}</span> <span class="fr">${esc(src)}</span>`, tpl: '___', ans: [[ans]],
      why: `${HINT_T[to] || ''} Răspuns: <b>${esc(ans)}</b>`
    });
  }
  return genTransform(1);
}
function drillFor(tid, n) {
  const out = [];
  if (tid === 'impe') { for (let i = 0; i < Math.min(n, 2); i++) out.push(conjTable('impe')); return out; }
  for (let i = 0; i < n; i++) out.push(i === n - 1 && !['fp', 'pr'].includes(tid) && Math.random() < .5 ? conjTable(tid) : conjSingle(tid));
  return out;
}

function makeTest() {

  ].map(fromAcord);

const ACCENTS = ['é', 'è', 'ê', 'ë', 'à', 'â', 'î', 'ï', 'ô', 'û', 'ù', 'ç', 'œ', '’', '-'];
const hintify = s => s.replace(/\(([^)]+)\)/g, '<span class="hint">($1)</span>');
function inputHtml(k, ans, wide) {
  const len = Math.min(26, Math.max(8, (ans || '').length + 3));
  return `<input class="fill${wide ? ' wide' : ''}" type="text" data-k="${k}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="răspuns ${k + 1}" ${wide ? '' : `style="width:${len}ch"`}>`;

function qBody(q) {
  const instr = `<div class="q-instr">${q.ins}</div>`;
  const acc = `<div class="accents no-print" aria-label="Litere cu diacritice">${ACCENTS.map(a => `<button type="button" data-act="acc" data-ch="${a}" aria-label="Inserează ${a}">${a}</button>`).join('')}</div>`;
  if (q.kind === 'fill') {
    let k = 0;
    const body = hintify(esc(q.tpl)).replace(/___/g, () => { const h = inputHtml(k, (q.ans[k] || [''])[0], q.wide); k++; return h; });
    return `${instr}${q.pre ? `<p class="q-text">${q.pre}</p>` : ''}<div class="q-text">${body}</div>${acc}`;
  }
  if (q.kind === 'table') {
    return `${instr}<div class="tscroll"><table class="tbl-in"><tbody>${q.rows.map((r, i) => `<tr><td class="pn" style="padding:4px 10px 4px 0;white-space:nowrap;font-family:var(--f-fr);font-size:1.1rem;color:var(--ink-2)">${esc(r.label)}</td><td>${inputHtml(i, r.ans)}</td></tr>`).join('')}</tbody></table></div>${acc}`;
  }
  if (q.kind === 'mcq') {
    return `${instr}<p class="q-text">${q.text}</p><div class="opts">${q.opts.map((o, i) => `<button type="button" class="opt${q.frOpts ? ' fr-o' : ''}" data-act="q-opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  if (q.kind === 'tap') {
    return `${instr}<div class="board"><div class="line">${q.tokens.map((t, i) => `<button type="button" class="tk pick hid" data-act="q-tap" data-i="${i}" data-role="${ROLE_CLS[t[1]] || 'CC'}"><span class="fr">${esc(t[0])}</span><i class="c-${ROLE_CLS[t[1]] || 'CC'}">${ROLE_LABEL[t[1]] || ''}</i></button>`).join('')}</div></div>
      <div class="btnrow" style="margin-top:12px"><button type="button" class="chip" data-act="q-none" aria-pressed="false">Nu există ${q.find}</button></div>`;
  }

/* ---------- runner ---------- */
let RUN = null, TICK = null;

function mountRunner(host, qs, opt) {
  stopTimers();

      run.left--;

      if (run.left <= 0) { collectCurrent(run, true); finishRun(run, true); }

}
function qState(run) { return run.qs[run.i]; }
function drawQ(run) {

  const pct = Math.round(run.i / run.qs.length * 100);
  const timer = run.mode === 'test' && run.opt.seconds ? `<span class="timer${run.left < 180 ? ' low' : ''}" id="timer" aria-label="Timp rămas">${fmtT(run.left)}</span>` : '';
  const catLbl = { acord: 'Acord', codcoi: 'COD / COI', pp: 'Participiu', aux: 'Auxiliar', conj: 'Conjugare', transform: 'Transformare', timp: 'Timp potrivit' }[q.cat] || '';
  host.innerHTML = `
    ${run.opt.title ? `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="font-size:1.25rem">${esc(run.opt.title)}</h3><button type="button" class="btn sec sm" data-act="q-quit">Ieși</button></div>` : ''}
    <div class="prog"><span>${run.i + 1} / ${run.qs.length}</span><div class="bar"><i style="width:${pct}%"></i></div>${timer}</div>
    <div class="q" id="qcard">
      <div class="q-meta">${badge(catLbl)}${run.mode === 'test' ? '<span class="small muted">Fără feedback până la final</span>' : ''}</div>
      ${qBody(q)}
      <div id="qfb" aria-live="polite"></div>
      <div class="btnrow" id="qctl" style="margin-top:18px">${controlsHtml(run, false)}</div>
    </div>`;
  const first = $('input.fill', host);
  if (first && run.opt.focus !== false) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
}
function controlsHtml(run, checked) {
  const q = qState(run), last = run.i === run.qs.length - 1;
  if (run.mode === 'test') return `<button type="button" class="btn" data-act="q-next">${last ? 'Termină testul' : 'Continuă'} ${ICO.arrow}</button>`;
  if (!checked) {
    const check = q.kind === 'mcq' ? '' : `<button type="button" class="btn" data-act="q-check">Verifică</button>`;
    return `${check}<button type="button" class="btn sec" data-act="q-reveal">Nu știu, arată-mi</button>`;
  }

}
function collectCurrent(run, silent) {
  const q = qState(run), card = $('#qcard', run.host);

}
function lockUI(run, ok) {

    const exp = expectedIdx(q), picked = q._tap.includes(i), want = exp.includes(i);

}
function showFeedback(run, ok, g) {

function record(run, ua, ok) {

ACT['q-check'] = () => {

  $$('.opt', run.host).forEach((b, k) => { if (k === q.ans) b.classList.add('ok'); else if (k === i) b.classList.add('no'); });

};
ACT['q-tap'] = el => {

ACT['q-none'] = el => {

ACT['q-quit'] = () => { stopTimers(); RUN = null; if (RUN_QUIT) RUN_QUIT(); };
let RUN_QUIT = null;
ACT['acc'] = el => {

function serializeQ(q) { return JSON.parse(JSON.stringify(q, (k, v) => (k[0] === '_' ? undefined : v))); }

function finishRun(run, timeout) {

  // întrebările fără răspuns (test) = greșite
  run.qs.forEach((q, i) => { if (!run.res[i]) run.res[i] = { q, ua: null, ok: false }; });
  const correct = run.res.filter(r => r.ok).length, pct = Math.round(correct / total * 100);
  const sid = run.opt.setId;
  if (sid && sid !== 'mistakes') S.best[sid] = Math.max(S.best[sid] || 0, pct);
  // greșeli
  const wrong = run.res.filter(r => !r.ok).map(r => serializeQ(r.q));
  const sigsWrong = new Set(wrong.map(qSig));

  const grd = Math.round((1 + 9 * correct / total) * 10) / 10;
  const msg = pct >= 90 ? 'Excelent. Ești gata pentru test.' : pct >= 70 ? 'Bine. Mai repetă ce ai greșit și e perfect.' : pct >= 50 ? 'Ai o bază. Recitește lecția și reia seria.' : 'Mai ai de lucrat. Reia lecția de la început, apoi încearcă din nou.';
  const items = run.res.map((r, i) => `<details class="acc"${r.ok ? '' : ' open'}><summary><span style="color:${r.ok ? 'var(--ok)' : 'var(--bad)'}">${r.ok ? ICO.check : ICO.x}</span><span class="small" style="font-weight:600">Întrebarea ${i + 1}</span></summary>
      <div class="acc-b"><div class="q-instr">${r.q.ins}</div>${r.q.pre ? `<p>${r.q.pre}</p>` : ''}${r.q.text ? `<p class="fr">${r.q.text}</p>` : r.q.kind === 'fill' ? `<p class="fr">${solutionHtml(r.q)}</p>` : ''}
      <p class="small"><b>Răspunsul tău:</b> ${userHtml(r.q, r.ua)}</p>${r.ok ? '' : `<p class="small"><b>Corect:</b> ${solutionHtml(r.q)}</p>`}${r.q.why ? `<p class="small">${r.q.why}</p>` : ''}</div></details>`).join('');
  const mini = run.opt.mini;
  host.innerHTML = mini ? `<div class="card flat"><div class="row"><span class="score" style="font-size:2.4rem">${correct}/${total}</span><div><b>${msg}</b></div></div>
      <div class="btnrow" style="margin-top:14px"><button type="button" class="btn sm" data-act="q-again">Încă o serie</button>${wrong.length ? `<button type="button" class="btn sec sm" data-act="q-show-review">Vezi greșelile</button>` : ''}</div>
      <div id="rv" hidden style="margin-top:14px">${items}</div></div>` : `
    <div class="card" style="margin-bottom:18px">
      ${timeout ? '<p class="warnbox" style="margin-bottom:14px">Timpul a expirat. Întrebările rămase au fost numărate ca greșite.</p>' : ''}
      <div class="row" style="gap:22px"><div><div class="score">${test ? String(grd).replace('.', ',') : correct + '/' + total}</div><div class="small muted">${test ? `${correct} din ${total} corecte · notă estimată` : `${pct}% corecte`}</div></div>
      <div style="flex:1;min-width:220px"><h3 style="margin-bottom:6px">${msg}</h3>${test ? '<p class="small muted">Nota reală depinde de baremul profesoarei. Aceasta e doar o estimare liniară (1 punct din oficiu).</p>' : ''}</div></div>
      <div class="btnrow" style="margin-top:18px"><button type="button" class="btn" data-act="q-again">${test ? 'Un test nou' : 'Reia seria'}</button>${wrong.length ? `<button type="button" class="btn sec" data-act="q-mistakes">Antrenează greșelile (${wrong.length})</button>` : ''}<button type="button" class="btn sec" data-act="q-quit">Înapoi la exerciții</button></div>

function anRender() {

  const shown = new Set();
  steps.slice(0, st).forEach(k => {

    if (st === steps.length && s.note) panel += `<div class="callout tip" style="margin-top:10px"><span class="cl">Reține</span>${s.note}</div>`;
  }
  $('#an-b').innerHTML = `${board(toks, esc(s.ro))}<div class="callout" style="margin-top:14px;min-height:96px">${panel}</div>`;
  $('#an-prev').disabled = st === 0;
  $('#an-next').disabled = st >= steps.length;
  $('#an-count').textContent = `Pasul ${st} / ${steps.length}`;
}

}

      <p class="small muted" style="margin-top:8px"><b>été</b> nu se acordă niciodată. <b>dû</b> își pierde accentul când se acordă: <i>due, dus, dues</i>.</p>

    <section class="sec">
      <h2>Cu AVOIR, pas cu pas</h2>

      <h3 class="sub">1. COD după verb sau fără COD: nu se acordă</h3>
      ${exList([[`J’ai ${R.AUX('acheté')} ${R.COD('les fleurs')}.`, 'COD după verb.'], [`Nous avons ${R.AUX('marché')} deux heures.`, 'Fără COD.'], [`Elle a ${R.AUX('téléphoné')} ${R.COI('à sa mère')}.`, 'Doar COI.']])}
      <h3 class="sub">2. COD înaintea verbului: se acordă. Patru cazuri</h3>

        ['Pronume personal COD: <b>me, te, le, la, l’, nous, vous, les</b>', `<span class="fr">Marie ? Je ${R.COD('l’')}ai ${R.AUX('vue')}.<br>Les enfants ? Je ${R.COD('les')} ai ${R.AUX('appelés')}.</span>`, 'cu persoana / lucrul pe care îl înlocuiește'],
        ['Pronumele relativ <b>que</b> (<b>qu’</b>)', `<span class="fr">Les fleurs ${R.COD('que')} j’ai ${R.AUX('achetées')}.</span>`, 'cu antecedentul lui (<i>les fleurs</i>)'],

      ${callout('tip', 'Pronumele l’ poate fi masculin sau feminin', `<p>Întreabă-te mereu <b>pe cine / ce înlocuiește</b>. <span class="fr">Paul ? Je l’ai ${R.AUX('vu')}.</span> <span class="fr">Marie ? Je l’ai ${R.AUX('vue')}.</span></p>`)}
      <h3 class="sub">3. COI: nu se acordă, niciodată</h3>
      <div class="prose"><p>Pronumele <b>lui</b> și <b>leur</b> sunt întotdeauna COI. <b>me, te, nous, vous</b> pot fi COI când verbul cere <i>à</i>: <span class="fr">Elle m’a ${R.AUX('téléphoné')}</span> (m’ = à moi). <span class="fr">Elle nous a ${R.AUX('répondu')}.</span> Testul: poți spune «à moi / à nous»? Atunci e COI.</p></div>
      <h3 class="sub">4. «en» și «y»: nu se acordă</h3>

    <section class="sec">

      ${exList([[`Elle est ${R.AUX('allée')} au cinéma.`, 'subiect feminin singular'], [`Mes amies sont ${R.AUX('arrivées')}.`, 'subiect feminin plural'], [`Marie et Paul sont ${R.AUX('venus')}.`, 'subiect mixt = masculin plural'], [`Madame, vous êtes ${R.AUX('arrivée')} à l’heure.`, 'vous de politețe, adresat unei femei: singular']])}
      <p class="muted prose"><b>Verbele cu două auxiliare</b> (monter, descendre, sortir, rentrer, retourner, passer): fără COD → être → cu subiectul (<span class="fr">Elle est ${R.AUX('montée')}</span>). Cu COD → avoir → regula cu avoir (<span class="fr">Elle a ${R.AUX('monté')} les valises</span> / <span class="fr">Les valises, elle les a ${R.AUX('montées')}</span>).</p>

      ${tbl(['Cazul', 'Verbe', 'Acord', 'Exemplu'], [

function flashRender() {
  const h = $('#flash'), f = FL;

    h.innerHTML = `<div class="card"><h3>Gata runda</h3><p class="lead" style="margin-bottom:14px">Știai ${f.known} din ${f.deck.length}.${f.again.length ? ` Mai ai ${f.again.length} de repetat.` : ' Toate sunt bifate.'}</p>

    return;
  }
  const c = f.deck[f.i], aux = c[4];
  const exm = aux === 'etre' ? `il est ${c[0]}` : aux === 'both' ? `il est ${c[0]} / il a ${c[0]}` : `il a ${c[0]}`;
  const face = f.flip

    : `<div class="flash-face"><span class="small muted" style="font-weight:700;letter-spacing:.1em">INFINITIV</span><div class="big">${c[1]}</div><div class="muted">${c[2]}</div><div class="small muted" style="margin-top:10px">Atinge pentru a întoarce</div></div>`;
  h.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="font-size:1.25rem">Cartonașe: participii</h3><button type="button" class="btn sec sm" data-act="flash-quit">Ieși</button></div>
    <div class="prog"><span>${f.i + 1} / ${f.deck.length}</span><div class="bar"><i style="width:${Math.round(f.i / f.deck.length * 100)}%"></i></div></div>
    <div class="flash"><button type="button" class="flash-in" style="width:100%;border:0;background:transparent;padding:0;text-align:center" data-act="flash-flip" aria-label="Întoarce cartonașul">${face}</button></div>
    <div class="btnrow" style="margin-top:14px;justify-content:center">${f.flip ? `<button type="button" class="btn sec" data-act="flash-no">Mai repet</button><button type="button" class="btn" data-act="flash-yes">Știu</button>` : `<button type="button" class="btn" data-act="flash-flip">Arată participiul</button>`}</div>
    ${canSpeak ? `<div class="btnrow" style="margin-top:10px;justify-content:center">${f.flip ? sayBtn(exm.split(' / ')[0]) : sayBtn(c[1])}</div>` : ''}`;
}
ACT['flash-flip'] = () => { if (!FL) return; FL.flip = !FL.flip; flashRender(); };

/* ===================== CONJUGATOR ===================== */
const CJ = { inf: 'prendre', aux: null, bonus: true };
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
const KNOWN = Array.from(new Set([...Object.keys(FR.VERBS), ...Object.keys(FR.RO)])).sort((a, b) => a.localeCompare(b, 'fr'));

    out.innerHTML = `<div class="callout warn"><span class="cl">Nu recunosc verbul</span><p>${vo.reason === 'empty' ? 'Scrie un verb la infinitiv.' : `«${esc(raw)}» nu pare un infinitiv francez pe care îl pot conjuga. Scrie verbul la infinitiv (de exemplu <i>chanter</i>, <i>finir</i>, <i>prendre</i>).`}</p>
      ${sug.length ? `<p>Poate ai vrut: ${sug.map(s => `<button type="button" class="chip" data-act="cj-chip" data-v="${esc(s)}">${esc(s)}</button>`).join(' ')}</p>` : ''}</div>`;
    return;
  }
  const v = vo.v, both = v.aux === 'both' && !vo.refl;
  const aux = CJ.aux && both ? CJ.aux : null;
  const o = aux ? { aux } : {};
  const label = (vo.refl ? 'se ' : '') + vo.inf;
  const eff = vo.refl ? 'etre' : (aux || (v.aux === 'both' ? 'etre' : v.aux));
  const T = (ids) => ids.map(id => conjHtml(raw, id, Object.assign({ title: `${TNAME[id]}`, sub: FR.TENSE_RO[id] }, o))).join('');
  const ess = ['present', 'pc', 'imp', 'pqp', 'fs', 'fp', 'pr', 'cond', 'impe'], bon = ['condp', 'subj', 'fa', 'ps'];
  const pp = v.pp, forms = FR.ppForms(pp);
  const notes = [];
  if (vo.assumed) notes.push(`Verbul nu este în baza mea de verbe neregulate. Am presupus <b>grupa 2</b> (-ir, cu -iss-). Dacă la <i>nous</i> face altceva decât <i>-issons</i>, e grupa 3 și formele pot fi greșite.`);
  else if (vo.generic && v.g === 3) notes.push('Verb din grupa 3, conjugat după regula familiei lui (nu e în lista de neregulate). Verifică dacă are forme speciale.');
  if (vo.refl) notes.push('Verb pronominal: auxiliarul este mereu <b>être</b>. Pronumele reflexiv (me, te, se, nous, vous) apare înaintea verbului.');
  out.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
        <div><h2 class="fr" style="font-size:2rem;font-family:var(--f-fr);font-weight:600;letter-spacing:0;display:flex;align-items:center;gap:10px">${esc(label)} ${sayBtn(label)}</h2><div class="muted">${esc(v.ro || '')}</div></div>
        <div class="chips">${groupBadge(v)}${vo.refl ? badge('être', 'av') : auxBadge(v)}</div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div><div class="small muted" style="font-weight:700">PARTICIPIU TRECUT</div><div class="fr" style="font-size:1.3rem"><b class="r r-AUX">${esc(pp)}</b></div><div class="small muted fr">${[...new Set(forms)].map(esc).join(' · ')}</div></div>
        <div><div class="small muted" style="font-weight:700">PARTICIPIU PREZENT</div><div class="fr" style="font-size:1.3rem">${esc(v.ppres)}</div><div class="small muted">nous: ${esc(v.pres[3])}</div></div>
      </div>
      ${both ? `<div class="row" style="margin-top:14px"><span class="small">La passé composé, <b>${esc(vo.inf)}</b> folosește:</span><div class="seg" role="group" aria-label="Auxiliar"><button type="button" data-act="cj-aux" data-a="etre" aria-pressed="${eff === 'etre'}">être (fără COD)</button><button type="button" data-act="cj-aux" data-a="avoir" aria-pressed="${eff === 'avoir'}">avoir (cu COD)</button></div></div>` : ''}
      ${notes.map(n => `<p class="warnbox" style="margin-top:12px">${n}</p>`).join('')}
    </div>
    ${legendHtml}
    <h3 class="sub">Timpurile esențiale</h3>
    <div class="conj-grid">${T(ess)}</div>
    <div class="row" style="margin:26px 0 10px;justify-content:space-between"><h3 class="sub" style="margin:0">Timpuri bonus</h3><button type="button" class="btn sec sm" data-act="cj-bonus">${CJ.bonus ? 'Ascunde' : 'Arată'}</button></div>
    ${CJ.bonus ? `<div class="conj-grid">${T(bon)}</div>` : ''}
    ${eff === 'etre' ? `<p class="small muted" style="margin-top:12px">La timpurile cu <i>être</i>, (e) și (s) arată posibilul acord. Scrii doar ce se potrivește subiectului.</p>` : ''}`;
}
ACT['cj-go'] = () => { CJ.inf = $('#cj-in').value; CJ.aux = null; cjRender(); };
ACT['cj-chip'] = el => { $('#cj-in').value = el.dataset.v; ACT['cj-go'](); };
ACT['cj-aux'] = el => { CJ.aux = el.dataset.a; cjRender(); };
ACT['cj-bonus'] = () => { CJ.bonus = !CJ.bonus; cjRender(); };
VIEWS.conjugator = {
  title: 'Conjugator',
  render() {
    return `
    <span class="eyebrow">Unelte</span>
    <h1 class="page-title">Conjugator</h1>
    <p class="lead">Scrie un verb la infinitiv și primești toate timpurile, cu radicalul și terminațiile evidențiate. Merge și pentru verbe pronominale (<i>se laver</i>).</p>
    <div class="row" style="align-items:stretch">
      <input type="search" id="cj-in" list="cj-list" value="${esc(CJ.inf)}" placeholder="ex. prendre, finir, se laver…" aria-label="Verb la infinitiv" style="flex:1;min-width:200px;font-size:1.1rem" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button type="button" class="btn" data-act="cj-go">Conjugă</button>
    </div>
    <datalist id="cj-list">${KNOWN.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
    <div class="chips" style="margin:12px 0 22px">${['être', 'avoir', 'aller', 'faire', 'prendre', 'venir', 'pouvoir', 'vouloir', 'finir', 'manger', 'se laver', 'partir'].map(v => `<button type="button" class="chip" data-act="cj-chip" data-v="${v}">${v}</button>`).join('')}</div>
    <div id="cj-out"></div>`;
  },
  after() {
    cjRender();
    const i = $('#cj-in');
    i.addEventListener('keydown', e => { if (e.key === 'Enter') ACT['cj-go'](); });
    i.addEventListener('change', () => ACT['cj-go']());
  }
};

/* ===================== FIȘĂ-REZUMAT ===================== */
const GLOSAR = [
  ['subiect', 'cine face acțiunea'], ['verb', 'ce face subiectul'], ['COD', 'complement direct: pe cine? / ce? (fără prepoziție)'], ['COI', 'complement indirect: cui? / despre cine? (cu à / de)'],
  ['infinitiv', 'forma din dicționar (parler)'], ['radical', 'verbul fără terminația infinitivului (parl-)'], ['terminație', 'partea care se schimbă la conjugare'],
  ['auxiliar', 'avoir sau être, la timpurile compuse'], ['participiu trecut', 'forma după auxiliar (mangé, parti)'], ['antecedent', 'cuvântul pe care îl înlocuiește un pronume (les fleurs → que)'],
  ['pronume reflexiv', 'me, te, se, nous, vous la verbe pronominale'], ['acord', 'adăugarea lui -e / -s după gen și număr']
];
VIEWS.fisa = {
  title: 'Fișă-rezumat',
  render() {
    const ids = ['present', 'pc', 'imp', 'pqp', 'fs', 'fp', 'pr', 'cond', 'condp', 'subj', 'fa', 'impe'];
    const rec = ids.map(id => { const t = C.TENSE_BY[id], r = FR.rows(FR.getVerb('parler'), id); return [`<b>${t.fr}</b>`, formulaTxt(t), `<span class="fr">${esc(r[0].full)}</span>`]; });
    const irrFs = C.TENSE_BY.fs.irregular.map(r => `${r[0]} → ${r[1]}`).join(' · ');
    return `
    <span class="eyebrow">Unelte</span>
    <div class="row" style="justify-content:space-between;align-items:flex-start"><h1 class="page-title">Fișă-rezumat</h1><button type="button" class="btn sec no-print" data-act="fisa-copy">Copiază ca text</button></div>
    <p class="lead">Tot ce contează, pe o singură pagină. Citește-o în autobuz, înainte de test, sau copiaz-o ca text.</p>
    <div id="fisa-doc">
    <section class="sec" style="margin-top:20px"><h2>1. Acordul participiului trecut</h2>
      ${tbl(['Auxiliar', 'Situația', 'Acord'], [
        ['ÊTRE', 'verb cu être (aller, partir, arriver…)', 'cu <b>subiectul</b>: <i>elle est partie</i>'],
        ['AVOIR', 'COD <b>înaintea</b> verbului (le, la, l’, les, me, te, nous, vous, que, quel…)', 'cu <b>COD-ul</b>: <i>les fleurs que j’ai achetées</i>'],
        ['AVOIR', 'COD după verb · fără COD · doar COI · <b>en</b>', '<b>invariabil</b>: <i>j’ai acheté les fleurs</i>, <i>je leur ai parlé</i>'],
        ['PRONOMINAL', 'se = COD · esențial pronominal', 'cu subiectul: <i>elle s’est lavée</i>, <i>ils se sont souvenus</i>'],
        ['PRONOMINAL', 'se = COI · COD după verb', 'invariabil: <i>ils se sont parlé</i>, <i>elle s’est lavé les mains</i>'],
        ['PRONOMINAL', 'COD înaintea verbului (que)', 'cu acel COD: <i>les mains qu’elle s’est lavées</i>']
      ], { noKey: false })}
      <p class="small muted" style="margin-top:8px">Forme: +e feminin · +s plural · +es feminin plural. <i>été</i> nu se acordă. COI: <b>niciodată</b>.</p></section>

    <section class="sec"><h2>2. COD sau COI?</h2>
      ${tbl(['', 'COD', 'COI'], [['Întrebare', 'pe cine? / ce?', 'cui? / despre cine?'], ['Prepoziție', 'niciuna', 'à / de'], ['Pronume', 'me, te, <b>le, la, l’, les</b>, nous, vous', 'me, te, <b>lui, leur</b>, nous, vous']])}</section>

    <section class="sec"><h2>3. Participiul trecut</h2>
      ${tbl(['Verbul', 'Participiul'], [['-er (grupa 1)', '-é: parlé'], ['-ir (grupa 2)', '-i: fini'], ['-dre regulat', '-u: vendu'], ['neregulate', '<span class="fr">pris, mis, fait, dit, écrit, ouvert, offert, vu, eu, été, pu, voulu, su, dû, né, mort, venu, tenu, reçu, lu, bu, cru, connu, vécu</span>']])}
      <p style="margin-top:10px"><b>Cu être:</b> <span class="fr">Devenir, Revenir, Monter, Rester, Sortir, Venir, Aller, Naître, Descendre, Entrer, Rentrer, Tomber, Retourner, Arriver, Mourir, Partir</span> + toate verbele pronominale. Cu COD, <i>monter, descendre, sortir, rentrer, retourner, passer</i> iau avoir.</p></section>

    <section class="sec"><h2>4. Formula fiecărui timp</h2>${tbl(['Timp', 'Formula', 'Exemplu'], rec, { noKey: true })}</section>

    <section class="sec"><h2>5. Terminații (prezent)</h2>
      ${tbl(['', 'je', 'tu', 'il', 'nous', 'vous', 'ils'], C.TENSE_BY.present.endings.rows)}
      <p class="small muted" style="margin-top:8px">Imparfait: radicalul lui <i>nous</i> + ais, ais, ait, ions, iez, aient (être → ét-). Viitor: infinitiv + ai, as, a, ons, ez, ont. Condițional: radical de viitor + terminațiile imperfectului. Subjonctif: radicalul lui <i>ils</i> + e, es, e, ions, iez, ent.</p></section>

    <section class="sec"><h2>6. Radicale neregulate de viitor</h2><p class="fr">${irrFs}</p></section>

    <section class="sec"><h2>7. Propoziții cu SI</h2>
      ${tbl(['SI +', 'Rezultat'], [['présent', 'futur simple'], ['imparfait', 'conditionnel présent'], ['plus-que-parfait', 'conditionnel passé']])}</section>

    <section class="sec"><h2>8. Cuvinte de timp</h2>
      ${tbl(['Cuvinte', 'Timp'], [['hier, il y a…, soudain, un jour, une fois', 'passé composé'], ['autrefois, souvent, toujours, d’habitude, quand j’étais petit', 'imparfait'], ['déjà, la veille, auparavant', 'plus-que-parfait'], ['demain, bientôt, la semaine prochaine', 'futur simple'], ['tout de suite, dans cinq minutes', 'futur proche'], ['à l’instant, tout à l’heure', 'passé récent']], { noKey: true })}</section>

    <section class="sec"><h2>9. Verbe neregulate frecvente</h2>
      <p class="small muted" style="margin-bottom:8px">Prezent (je / nous / ils), imparfait (je), viitor (je), participiu și auxiliar.</p>
      <div class="conj-t tscroll tbl"><table><thead><tr><th>Infinitiv</th><th>Prezent</th><th>Imparfait</th><th>Viitor</th><th>Participiu</th></tr></thead><tbody>${IRR.map(inf => { const vo = FR.getVerb(inf), v = vo.v, pr = FR.rows(vo, 'present'), im = FR.rows(vo, 'imp'), fu = FR.rows(vo, 'fs'); const aux = v.aux === 'both' ? 'avoir / être' : v.aux === 'etre' ? 'être' : 'avoir'; return `<tr><td class="k"><span class="fr">${esc(inf)}</span></td><td class="fr" style="white-space:nowrap">${esc(pr[0].full)} · ${esc(pr[3].full)} · ${esc(pr[5].full)}</td><td class="fr" style="white-space:nowrap">${esc(im[0].full)}</td><td class="fr" style="white-space:nowrap">${esc(fu[0].full)}</td><td class="fr" style="white-space:nowrap"><b class="r r-AUX">${esc(v.pp)}</b> <span class="small muted">(${aux})</span></td></tr>`; }).join('')}</tbody></table></div>
      <p class="small" style="margin-top:8px"><b>Același model:</b> ${IRR_FAM}.</p></section>

    <section class="sec"><h2>10. Glosar</h2>${tbl(['Termen', 'Înseamnă'], GLOSAR)}</section>
    </div>`;
  },
  after() { }
};
ACT['fisa-copy'] = async () => {
  const el = $('#fisa-doc'); if (!el) return;
  try { await navigator.clipboard.writeText(el.innerText); toast('Fișa a fost copiată ca text.'); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    toast('Textul e selectat. Apasă Ctrl / ⌘ + C.');
  }
};

/* ===== main: schelet, navigare, teme, evenimente ===== */
const NAV = [
  ['start', 'Acasă'],
  { h: 'Lecții, în ordine' },
  ['baze', 'Bazele: COD și COI', 1], ['grupe', 'Grupele de verbe', 2], ['timpuri', 'Timpurile', 3], ['participiu', 'Participiul trecut', 4], ['acord', 'Acordul participiului', 5],
  { h: 'Antrenament' },
  ['exercitii', 'Exerciții'], ['test', 'Test simulat'],
  { h: 'Unelte' },
  ['conjugator', 'Conjugator'], ['fisa', 'Fișă-rezumat']
];
let ROUTE = null, SHOWN = null;
function current() { const id = ROUTE || location.hash.slice(1) || 'start'; return VIEWS[id] ? id : 'start'; }
function updateNav() {
  const cur = current();
  const nav = $('#nav'); if (!nav) return;
  nav.innerHTML = NAV.map(n => {
    if (n.h) return `<div class="nav-h">${n.h}</div>`;
    const done = n[2] && S.done[n[0]];
    const mark = n[2] ? `<span class="n${done ? ' done' : ''}">${done ? ICO.check : n[2]}</span>` : '<span class="n dot"></span>';
    return `<a href="#${n[0]}"${cur === n[0] ? ' aria-current="page"' : ''}>${mark}<span>${n[1]}</span></a>`;
  }).join('');
  const p = progressPct();
  $('#side-pct').textContent = p + '%';
  $('#side-bar').style.width = p + '%';
}
function go(id) {
  if (!VIEWS[id]) return;
  ROUTE = id;
  try { location.hash = id; } catch (e) { /* ignorat */ }
  render();
}
function render() {
  stopTimers(); RUN = null; RUN_QUIT = null; FL = null;
  const id = current(), v = VIEWS[id];
  SHOWN = id;
  const host = $('#view');
  host.innerHTML = v.render();
  if (v.after) v.after();
  updateNav();
  $('#side').classList.remove('open');
  window.scrollTo(0, 0);
}
function applyTheme() {
  const r = document.documentElement;
  if (S.theme) r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
}
ACT['theme'] = () => {
  const dark = S.theme ? S.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; store.set('theme', S.theme); applyTheme();
};
ACT['menu'] = () => { $('#side').classList.add('open'); };
ACT['menu-close'] = () => { $('#side').classList.remove('open'); };
ACT['say'] = el => speak(el.dataset.say);

function boot() {
  document.body.insertAdjacentHTML('afterbegin', `
  <div class="app">
    <aside class="side" id="side" aria-label="Navigare">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <a class="brand" href="#start"><span class="brand-mark" aria-hidden="true"></span><span><span class="brand-name">Cahier de français</span><div class="brand-sub">pregătire pentru test · clasa a 11-a</div></span></a>
        <button type="button" class="iconbtn only-m" data-act="menu-close" aria-label="Închide meniul">${ICO.close}</button>
      </div>
      <nav class="nav" id="nav" aria-label="Secțiuni"></nav>
      <div class="side-foot">
        <div class="row"><span>Progres</span><b id="side-pct">0%</b></div>
        <div class="bar" role="presentation"><i id="side-bar" style="width:0"></i></div>
        <div class="row" style="margin-top:6px"><span class="small">Tema</span><button type="button" class="iconbtn" data-act="theme" aria-label="Schimbă tema (luminos / întunecat)">${ICO.theme}</button></div>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <button type="button" class="iconbtn" data-act="menu" aria-label="Deschide meniul">${ICO.menu}</button>
        <a class="brand" href="#start"><span class="brand-name">Cahier de français</span></a>
        <span class="sp"></span>
        <button type="button" class="iconbtn" data-act="theme" aria-label="Schimbă tema (luminos / întunecat)">${ICO.theme}</button>
      </header>
      <main class="wrap" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>`);
  applyTheme();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
    const a = e.target.closest('a[href^="#"]');
    if (a && !a.dataset.act) {
      const id = a.getAttribute('href').slice(1);
      if (VIEWS[id]) { e.preventDefault(); go(id); }
    }
  });
  document.addEventListener('input', e => { const el = e.target.closest('[data-act-input]'); if (el && ACT[el.dataset.actInput]) ACT[el.dataset.actInput](el, e); });
  document.addEventListener('change', e => { const el = e.target.closest('[data-act-change]'); if (el && ACT[el.dataset.actChange]) ACT[el.dataset.actChange](el, e); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#side').classList.remove('open'); });
  window.addEventListener('hashchange', () => { ROUTE = null; if (current() !== SHOWN) render(); });
  if (canSpeak) { try { window.speechSynthesis.getVoices(); } catch (e) { /* ignorat */ } }
  render();
}
boot();

})();
</script>
</body>
</html>
